<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Travel marketplace architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071416"/>
      <stop offset="100%" stop-color="#12363c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="18" fill="url(#bg)"/>
  <text x="40" y="48" fill="#f3ebe0" font-family="Georgia, serif" font-size="26">Travel marketplace systems</text>
  <text x="40" y="78" fill="#9bb8b2" font-family="sans-serif" font-size="14">Anonymized overview of production surfaces I work on</text>

  <rect x="40" y="120" width="200" height="90" rx="12" fill="#0e4a52" stroke="#e07a5f" stroke-width="2"/>
  <text x="60" y="155" fill="#e8f4f2" font-family="sans-serif" font-size="16" font-weight="700">phoenix-ui</text>
  <text x="60" y="180" fill="#c5ddd8" font-family="sans-serif" font-size="13">Next.js / React</text>
  <text x="60" y="198" fill="#9bb8b2" font-family="sans-serif" font-size="12">storefront · CTC · checkout</text>

  <rect x="280" y="120" width="220" height="90" rx="12" fill="#0e4a52" stroke="#e8f4f2" stroke-width="1.5"/>
  <text x="300" y="155" fill="#e8f4f2" font-family="sans-serif" font-size="16" font-weight="700">phoenix (Rails)</text>
  <text x="300" y="180" fill="#c5ddd8" font-family="sans-serif" font-size="13">GraphQL · REST · admin</text>
  <text x="300" y="198" fill="#9bb8b2" font-family="sans-serif" font-size="12">bookings · trips · leads</text>

  <rect x="540" y="110" width="180" height="55" rx="12" fill="#1a3034" stroke="#9bb8b2"/>
  <text x="560" y="143" fill="#e8f4f2" font-family="sans-serif" font-size="14">HubSpot CRM</text>

  <rect x="540" y="180" width="180" height="55" rx="12" fill="#1a3034" stroke="#9bb8b2"/>
  <text x="560" y="213" fill="#e8f4f2" font-family="sans-serif" font-size="14">PayPal checkout</text>

  <rect x="760" y="120" width="160" height="90" rx="12" fill="#1a3034" stroke="#9bb8b2"/>
  <text x="780" y="155" fill="#e8f4f2" font-family="sans-serif" font-size="14">PostgreSQL</text>
  <text x="780" y="178" fill="#c5ddd8" font-family="sans-serif" font-size="12">+ Sidekiq / Redis</text>
  <text x="780" y="198" fill="#9bb8b2" font-family="sans-serif" font-size="12">jobs · search · sync</text>

  <path d="M240 165 H280" stroke="#e07a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 150 H540" stroke="#e8f4f2" stroke-width="1.5"/>
  <path d="M500 190 H540" stroke="#e8f4f2" stroke-width="1.5"/>
  <path d="M500 165 H760" stroke="#e8f4f2" stroke-width="1.5"/>

  <rect x="40" y="260" width="280" height="110" rx="12" fill="#10282c" stroke="#e8f4f233"/>
  <text x="60" y="295" fill="#e07a5f" font-family="sans-serif" font-size="13" font-weight="700">ADMIN AT SCALE</text>
  <text x="60" y="325" fill="#e8f4f2" font-family="sans-serif" font-size="28" font-weight="700">70k+ bookings</text>
  <text x="60" y="350" fill="#9bb8b2" font-family="sans-serif" font-size="13">filterable orders · lead pipelines · CSV reports</text>

  <rect x="340" y="260" width="280" height="110" rx="12" fill="#10282c" stroke="#e8f4f233"/>
  <text x="360" y="295" fill="#e07a5f" font-family="sans-serif" font-size="13" font-weight="700">CATALOG</text>
  <text x="360" y="325" fill="#e8f4f2" font-family="sans-serif" font-size="28" font-weight="700">180k+ trips</text>
  <text x="360" y="350" fill="#9bb8b2" font-family="sans-serif" font-size="13">supplier sync · Magento bridge · AI trips</text>

  <rect x="640" y="260" width="280" height="110" rx="12" fill="#10282c" stroke="#e8f4f233"/>
  <text x="660" y="295" fill="#e07a5f" font-family="sans-serif" font-size="13" font-weight="700">INTEGRATIONS</text>
  <text x="660" y="325" fill="#e8f4f2" font-family="sans-serif" font-size="22" font-weight="700">CRM + payments</text>
  <text x="660" y="350" fill="#9bb8b2" font-family="sans-serif" font-size="13">HubSpot deal sync · PayPal capture flows</text>
</svg>
